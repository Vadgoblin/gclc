name: Build AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed so git describe finds release tags

      - name: Restore Qt build cache
        uses: actions/cache@v6
        with:
          path: .build-cache
          key: qt-cache-${{ runner.os }}-${{ hashFiles('package/build-appimage.sh') }}

      - name: Build AppImage via Docker
        run: make -C package appimage VERSION=${{ github.ref_name }}

      - name: Verify generated AppImage
        run: ls -lh dist/*.AppImage

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          tag_name: ${{ github.ref_name }}
